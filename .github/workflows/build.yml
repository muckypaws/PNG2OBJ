name: Build standalone apps & installers

# Produces the standalone PNG2OBJ CLI builds and OS installers.
#
# Nuitka cannot cross-compile, so each OS is built on its own native runner.
# This workflow is the real mechanism for producing the macOS .dmg and Windows
# .msi (which cannot be built on the Linux dev/CI box used during development).
#
# Triggers:
#   - workflow_dispatch: build on demand from the Actions tab.
#   - push tags 'v*':    build release artifacts for a version tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (AppImage + binary)
          - os: macos-latest
            name: macOS (.app + .dmg)
          - os: windows-latest
            name: Windows (.exe + .msi)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # --- Linux ----------------------------------------------------------
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # patchelf for Nuitka standalone; ccache to speed up rebuilds;
          # desktop-file-utils for .desktop validation; libfuse2 so AppImages
          # can run (the make script also has a FUSE-less fallback).
          sudo apt-get install -y patchelf ccache desktop-file-utils libfuse2 || \
            sudo apt-get install -y patchelf ccache desktop-file-utils fuse

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          bash packaging/build_linux.sh
          bash packaging/linux/make_appimage.sh

      # --- macOS ----------------------------------------------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/build_macos.sh
          bash packaging/macos/make_dmg.sh

      # --- Windows --------------------------------------------------------
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix
          # The global tools dir is already on PATH for later steps on GitHub
          # runners; echo for logs.
          wix --version

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\build_windows.ps1 -Msi

      # --- Collect artifacts ---------------------------------------------
      - name: List dist
        shell: bash
        run: ls -lh dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: png2obj-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/png2obj
            dist/png2obj.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
            dist/PNG2OBJ.app/**
